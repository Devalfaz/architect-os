name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yml'
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx github-label-sync --access-token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels.yml ${{ github.repository }}
