# Canonical label definitions — github-label-sync format.
# Sync: npx github-label-sync --labels .github/labels.yml <owner>/<repo>
# (label-sync.yml workflow runs this automatically on push to main.)
# Human decision guide for WHEN to use each label: label-taxonomy.md

# ── Lifecycle ────────────────────────────────────────────────
- name: needs-triage
  color: "B60205"
  description: Raw, unprocessed — default for new issues
- name: needs-info
  color: "D93F0B"
  description: Insufficient detail — waiting on reporter
- name: ready-for-agent
  color: "0E8A16"
  description: Fully specified with file-level plan, AC, test plan — executable by AI
- name: ready-for-human
  color: "006B75"
  description: Too complex/ambiguous for agent — needs human implementation
- name: in-progress
  color: "FBCA04"
  description: Agent or human is actively working this
- name: in-review
  color: "1D76DB"
  description: PR is open, review pipeline active
- name: wontfix
  color: "CCCCCC"
  description: Rejected — reason in closing comment

# ── Size ─────────────────────────────────────────────────────
- name: "size:XS"
  color: "C2E0C6"
  description: ≤50 lines — fire-and-forget capable
- name: "size:S"
  color: "0E8A16"
  description: 50–150 lines — agent-primary, one file
- name: "size:M"
  color: "FBCA04"
  description: 150–400 lines — max for single ticket
- name: "size:split-me"
  color: "B60205"
  description: ">400 lines — must split before agent can touch"

# ── Area ─────────────────────────────────────────────────────
- name: "area:api"
  color: "0052CC"
  description: API endpoints, route handlers (src/app/api/)
- name: "area:auth"
  color: "5319E7"
  description: Authentication, authorization (src/server/auth/)
- name: "area:ui"
  color: "D4C5F9"
  description: Frontend components, pages (src/components/, src/app/)
- name: "area:db"
  color: "1D76DB"
  description: Database schema, queries, migrations (src/server/db/)
- name: "area:infra"
  color: "B60205"
  description: CI/CD, hosting, deployment, tooling (.github/)
- name: "area:docs"
  color: "C5DEF5"
  description: Documentation changes (docs/)
- name: "area:test"
  color: "C2E0C6"
  description: Testing infrastructure (*.test.*, *.spec.*, e2e)
- name: "area:perf"
  color: "FBCA04"
  description: Performance-sensitive code, optimization
- name: "area:security"
  color: "B60205"
  description: Security-sensitive paths, auth, validation, secrets

# ── Priority ─────────────────────────────────────────────────
- name: "P0:now"
  color: "B60205"
  description: Blocking everything — drop what you're doing
- name: "P1:next"
  color: "D93F0B"
  description: Next in queue after current work — this sprint
- name: "P2:soon"
  color: "FBCA04"
  description: This month — after P1s
- name: "P3:later"
  color: "0E8A16"
  description: Backlog — good first issue
- name: "P4:icebox"
  color: "CCCCCC"
  description: Someday — not prioritized, may never be done

# ── Signal ───────────────────────────────────────────────────
- name: "ai:ready"
  color: "0E8A16"
  description: Gated at S5, ready for agent implementation
- name: "ai:implemented"
  color: "1D76DB"
  description: Agent has opened a PR
- name: "ai:self-reviewed"
  color: "006B75"
  description: Agent has posted self-review comment on PR
- name: bug
  color: "B60205"
  description: Defect, not feature — triggers diagnosing-bugs workflow
- name: regression
  color: "D93F0B"
  description: Previously worked, now broken — high severity
- name: needs-decision
  color: "FBCA04"
  description: Blocked on unresolved decision
- name: good-first-agent
  color: "C2E0C6"
  description: Excellent for new agent setup or calibration
- name: tech-debt
  color: "5319E7"
  description: Refactor, not feature — from improve-codebase-architecture

# ── Workflow (auto-applied) ──────────────────────────────────
- name: spec-delta
  color: "D4C5F9"
  description: PR or issue that amends the spec
- name: breaking-change
  color: "B60205"
  description: PR introduces a breaking change
- name: dependencies
  color: "C5DEF5"
  description: PR updates dependencies (Dependabot/agent)
- name: duplicate
  color: "CCCCCC"
  description: Issue duplicates an existing one
- name: help-wanted
  color: "0E8A16"
  description: Extra attention needed
